# Runs the patch tests and builds the bundle, so pull requests are checked before they merge
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read
  # Morphe's Gradle plugin comes from GitHub Packages
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build the bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :patches:test :patches:buildAndroid
